# voxel_plus 前端 LIO 参数(由 lio_node.cpp 用 nh.param 读取)
# 加载方式见 voxel_plus/launch/mapping.launch 的 <rosparam>

# ---------- 数据源 ----------
lidar_topic: /livox/lidar        # 订阅的雷达话题(默认 /livox/lidar)
imu_topic: /livox/imu            # 订阅的 IMU 话题(默认 /livox/imu)

# ---------- 坐标系名称 ----------
map_frame: lidar                 # 地图/世界坐标系名(默认 map)
body_frame: body                 # 机体系名称(默认 body)

# ---------- 可视化 ----------
publish_voxel_map: true          # 是否把体素平面发布成 MarkerArray 供 rviz 显示(默认 false)
publish_voxel_num: 2000          # 每次最多发布多少个体素(默认 1000)

# ---------- 地图与平面拟合 ----------
scan_resolution: 0.1             # 输入点云的体素降采样边长, 传给 pcl::VoxelGrid(默认 0.1)
voxel_size: 0.4                  # 地图体素边长, 越小地图越细但内存/耗时越高(默认 0.4)
map_capacity: 100000             # 地图体素数量上限, 超出后按 LRU 淘汰最久未用的体素(默认 100000)
max_point_thresh: 100            # 单个体素保留的点数上限, 达到后冻结该平面并释放点缓存(默认 100)
# NOTE: 键名与代码不一致! lio_node.cpp 读取的是单数形式 "update_size_thresh"(默认 10),
#       所以这里的 update_size_threshes 永远不会被读到, 实际生效值是默认的 10。
update_size_threshes: 20         # 意图: 每新增多少个点重算一次平面(对应 VoxelGrid::update_point_thresh)
merge_thresh_for_angle: 0.2      # 体素间平面合并的法向夹角阈值, 形式为 1-cos(theta)(默认 0.1)
merge_thresh_for_distance: 0.04  # 体素间平面合并的原点到平面距离差阈值(默认 0.04)

# ---------- 以下参数本文件未列出, 代码会使用各自的默认值 ----------
# filter_num: 3            # 点云滤波相关(默认 3)
# range_min: 0.5           # 有效点最小距离(默认 0.5)
# range_max: 20.0          # 有效点最大距离(默认 20.0)
# gravity_align: true      # 是否用重力对齐初始姿态(默认 true)
# imu_init_num: 20         # IMU 初始化所需帧数(默认 20)
# na: 0.01                 # IMU 加速度计噪声(默认 0.01)
# ng: 0.01                 # IMU 陀螺仪噪声(默认 0.01)
# nbg: 0.0001              # 陀螺仪零偏随机游走(默认 0.0001), 填进 Q 的第 6 块 -> 陀螺零偏 BG_ID
# nba: 0.0001              # 加速度计零偏随机游走(默认 0.0001), 填进 Q 的第 9 块 -> 加计零偏 BA_ID
# opti_max_iter: 5         # IESKF 每帧最大迭代次数(默认 5)
# r_il: [1,0,0, 0,1,0, 0,0,1]  # 雷达->IMU 旋转外参(行优先 3x3, 默认单位阵)
# p_il: [0,0,0]                # 雷达->IMU 平移外参(默认零向量)
